name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  validate:
    name: Format, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Install documentation and hook tooling
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Restore solution
        run: dotnet restore Talby.Core.ResxAccess.slnx

      - name: Build Release
        run: dotnet build Talby.Core.ResxAccess.slnx --configuration Release --no-restore

      - name: Run every test and validate results
        shell: pwsh
        run: ./tests/run.ps1 -Mode full

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: test-results/execution/**/*.trx
          if-no-files-found: ignore
